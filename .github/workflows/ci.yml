name: CI

on:
  push:
    branches: [main, develop, 'codex/**', 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          version: '0.11.32'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra frontend
      - name: Backend and frontend regression tests
        run: uv run --no-sync pytest -q tests frontend/streamlit_app/tests
      - name: Gemini resilience (no live API)
        run: uv run --no-sync python frontend/streamlit_app/tests/test_gemini_resilience.py
      - name: Frontend dependency and page import checks
        run: uv run --no-sync python frontend/streamlit_app/verify_deployment.py
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Format
        run: uv run --no-sync black --workers 1 --check backend tests agents frontend database integration_tests

  postgres-storage:
    name: PostgreSQL 16 storage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coach_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: coach_storage_test_control
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U coach_test -d coach_storage_test_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_ENABLED: 'false'
      RIOT_API_KEY: ''
      HENRIK_API_KEY: ''
      TRACKER_API_KEY: ''
      RIOT_ENABLED: 'false'
      HENRIK_ENABLED: 'false'
      TRACKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          version: '0.11.32'
          python-version: '3.12'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Real PostgreSQL migrations and persistent REST storage
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://coach_test:synthetic-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/coach_storage_test_control
        run: uv run --no-sync pytest -q integration_tests/test_postgres_storage.py

  backend-image:
    name: Backend container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build -f docker/backend.Dockerfile -t valorant-coach:test .
      - name: Verify unprivileged runtime and production imports
        run: |
          docker run --rm valorant-coach:test sh -c 'test "$(id -u)" -ne 0'
          docker run --rm valorant-coach:test uv run --no-sync python -c 'import backend.main, httpx; from google import genai; import jwt, argon2; import importlib.util; assert importlib.util.find_spec("pytest") is None'
      - name: Check liveness without provider credentials
        shell: bash
        run: |
          docker run -d --name coach-smoke -p 127.0.0.1:8000:8000 valorant-coach:test
          trap 'docker logs coach-smoke; docker rm -f coach-smoke' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors --connect-timeout 1 --max-time 3 --retry-max-time 30 http://127.0.0.1:8000/health/live
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/players/Test/EU1)" = 503
          # Verify vision endpoint is wired up and protected (returns 401 Unauthorized, not 500)
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/vision/scoreboard/analyze -H 'Content-Type: application/json' -d '{}')" = 401

  frontend-web-image:
    name: Frontend Web container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build Angular HUD Bento image
        run: docker build --progress=plain -f docker/frontend-web.Dockerfile -t valorant-coach-web:test .
      - name: Verify Nginx serving index.html
        shell: bash
        run: |
          docker run -d --name coach-web-smoke -p 127.0.0.1:8080:80 valorant-coach-web:test
          trap 'docker logs coach-web-smoke; docker rm -f coach-web-smoke' EXIT
          curl --fail --retry 10 --retry-delay 1 http://127.0.0.1:8080/health
          curl -s http://127.0.0.1:8080/ | grep -q 'Mejora tu próxima partida'

