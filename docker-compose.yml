services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_NAME: ${APP_NAME:-ValorantAICoach}
      APP_PORT: ${APP_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://valorant:valorant@postgres:5432/valorant_ai_coach}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - ./database:/app/database
      - ./alembic.ini:/app/alembic.ini
      # Keep the container virtualenv isolated from bind mounts
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-valorant_ai_coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valorant}
      POSTGRES_USER: ${POSTGRES_USER:-valorant}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  backend_venv:
